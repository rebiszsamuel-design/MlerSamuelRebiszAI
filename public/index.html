<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mullar.Online</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <main class="profile-card">

        <div class="cover"></div>

        <section class="profile-content">

            <div class="avatar-wrapper">
                <div class="avatar">
                    M
                </div>

                <span class="online"></span>
            </div>

            <div class="profile-name">
                <h1>Mullar</h1>
                <span class="badge">MULLAR</span>
            </div>

            <p class="username">@mullar</p>

            <p class="bio">
                Welcome to Mullar.Online
                <br>
                Create your own profile.
            </p>

            <div class="stats">

                <div>
                    <strong>1</strong>
                    <span>Profile</span>
                </div>

                <div>
                    <strong>0</strong>
                    <span>Views</span>
                </div>

                <div>
                    <strong>∞</strong>
                    <span>Vibes</span>
                </div>

            </div>

            <div class="links">

                <a href="#" class="link">
                    <span class="link-icon">◈</span>
                    <span>Discord</span>
                    <span class="arrow">→</span>
                </a>

                <a href="#" class="link">
                    <span class="link-icon">◉</span>
                    <span>GitHub</span>
                    <span class="arrow">→</span>
                </a>

                <a href="#" class="link">
                    <span class="link-icon">◎</span>
                    <span>Instagram</span>
                    <span class="arrow">→</span>
                </a>

            </div>

            <div class="footer">
                <span>Powered by</span>
                <strong>Mullar.Online</strong>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
