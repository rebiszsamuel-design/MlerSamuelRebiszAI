<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register — Mullar.Online</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="profile-card auth-card">

        <section class="profile-content">

            <div class="auth-logo">
                M
            </div>

            <h1>Utwórz konto</h1>

            <p class="auth-description">
                Dołącz do Mullar.Online
            </p>

            <form id="registerForm">

                <input
                    id="username"
                    type="text"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="Hasło"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">
                    Utwórz konto
                </button>

            </form>

            <p id="message"></p>

            <div class="auth-footer">
                Masz już konto?
                <a href="login.html">Zaloguj się</a>
            </div>

        </section>

    </main>

    <script src="register.js"></script>

</body>
</html>
