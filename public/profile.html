<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mullar.Online</title>

    <link
        rel="stylesheet"
        href="/profile.css"
    >
</head>

<body>

    <div class="background">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

    </div>


    <main class="profile-card">

        <!-- ================================
             BANNER
        ================================= -->

        <div
            class="profile-banner"
            id="profileBanner"
        ></div>


        <!-- ================================
             PROFILE CONTENT
        ================================= -->

        <section class="profile-content">


            <!-- ================================
                 AVATAR
            ================================= -->

            <div class="avatar-wrapper">

                <div
                    class="avatar"
                    id="avatar"
                >
                    M
                </div>

                <span
                    class="online"
                    title="Online"
                ></span>

            </div>


            <!-- ================================
                 NAME
            ================================= -->

            <div class="profile-name">

                <h1 id="username">
                    Mullar
                </h1>

                <span
                    class="badge free-badge"
                    id="plan"
                >
                    FREE
                </span>

            </div>


            <!-- ================================
                 USERNAME
            ================================= -->

            <p
                class="username"
                id="handle"
            >
                @mullar
            </p>


            <!-- ================================
                 BIO
            ================================= -->

            <p
                class="bio"
                id="bio"
            >
                Welcome to my Mullar.Online profile.
            </p>


            <!-- ================================
                 SOCIAL LINKS
            ================================= -->

            <div class="profile-links">

                <a
                    class="profile-link"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Discord
                </a>

                <a
                    class="profile-link"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub
                </a>

                <a
                    class="profile-link"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Instagram
                </a>

            </div>


            <!-- ================================
                 MEMBER SINCE
            ================================= -->

            <div class="member-since">

                <span>
                    Członek od
                </span>

                <strong id="memberSince">
                    —
                </strong>

            </div>


        </section>

    </main>


    <script src="/profile.js"></script>

</body>

</html>
