<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mullar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0a0f0b;
      --surface: #0f1710;
      --text: #e8f5e9;
      --text-dim: #ffffff;
      --accent: #ffffff;
      --accent-dim:#ffffff;
      --border: #000000;
      --sidebar: #0c140e;
      --gold: #f1c40f;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; display: flex; overflow: hidden; }
    #sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; }
    .sidebar-header { padding: 0 20px 16px; font-size: 1.5rem; font-weight: 600; color: var(--accent); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .sidebar-header i.fa-leaf { font-size: 1.8rem; color: var(--accent); }
    .new-chat { margin: 16px 20px; padding: 12px; background: var(--accent-dim); color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .new-chat:hover { background: var(--accent); }
    .chat-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .chat-item { display: flex; align-items: center; padding: 10px 16px; margin: 4px 0; border-radius: 8px; cursor: pointer; }
    .chat-item:hover, .chat-item.active { background: rgba(46,204,113,0.12); color: var(--accent); }
    .chat-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .delete-chat { opacity: 0; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: #888; }
    .chat-item:hover .delete-chat { opacity: 1; }
    #main { flex: 1; display: flex; flex-direction: column; }
    header { padding: 14px 24px; border-bottom: 1px solid var(--border); font-size: 1.25rem; background: var(--surface); }
    .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .message { display: flex; gap: 12px; max-width: 80%; opacity: 0; animation: fadeIn 0.4s forwards; }
    .message.user { flex-direction: row-reverse; align-self: flex-end; }
    @keyframes fadeIn { to { opacity:1; transform:translateY(0); } }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-dim); color: #000; display: grid; place-items: center; }
    .message.user .avatar { background: #27ae60; }
    .bubble { padding: 12px 16px; border-radius: 14px; background: var(--surface); line-height: 1.5; }
    .message.user .bubble { background: var(--accent-dim); color: #000; }
    .input-area { padding: 16px 24px; background: var(--surface); border-top: 1px solid var(--border); }
    .input-wrapper { display: flex; align-items: end; background: rgba(46,204,113,0.08); border: 1px solid var(--border); border-radius: 999px; padding: 6px; gap: 6px; }
    textarea { flex: 1; background: transparent; border: none; color: var(--text); font-size: 1.05rem; padding: 12px 18px; resize: none; min-height: 48px; max-height: 160px; }
    textarea:focus { outline: none; }
    button.send { background: var(--accent); color: #000; width: 44px; height: 44px; border: none; border-radius: 50%; cursor: pointer; }
    button.send:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>
<div id="sidebar">
  <div class="sidebar-header"><i class="fa-solid fa-leaf"></i> Mullar</div>
  <button class="new-chat" onclick="startNewChat()">Nowy czat</button>
  <div class="chat-list" id="chatList"></div>
</div>
<div id="main">
  <header id="chatTitle">Nowy czat</header>
  <div class="chat-container" id="chat"></div>
  <div class="input-area">
    <div id="previewArea" class="preview-container"></div>
    <div class="input-wrapper">
      <textarea id="input" rows="1" placeholder="Napisz wiadomość..."></textarea>
      <button class="send" id="sendBtn" disabled><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const GROQ_API_KEY = "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";

// ==================== STATE ====================
let currentChatId = null;
let chats = JSON.parse(localStorage.getItem("mullar_chats") || "{}");
let currentImages = [];

// ==================== SPECIAL COMMANDS ====================
function handleSpecialCommands(text) {
  const t = text.trim();
  if (t === "!dcd") return "Kolejowy Mikos Obejrzyj se najnowszy odcinek mordo";
  if (t === "!Best") return "EP07-355";
  return null;
}

// ==================== UTILS ====================
function generateChatId() { return 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2,9); }
function saveChats() { localStorage.setItem("mullar_chats", JSON.stringify(chats)); }

// ==================== RENDER ====================
function renderChatList() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";
  Object.keys(chats).sort((a,b) => chats[b].updated - chats[a].updated).forEach(id => {
    const item = document.createElement("div");
    item.className = `chat-item ${id === currentChatId ? 'active' : ''}`;
    item.innerHTML = `<div class="title">${chats[id].title}</div>`;
    item.onclick = () => loadChat(id);
    list.appendChild(item);
  });
}

function startNewChat() {
  currentChatId = null;
  document.getElementById("chat").innerHTML = "";
  document.getElementById("chatTitle").textContent = "Nowy czat";
  renderChatList();
}

function loadChat(id) {
  currentChatId = id;
  renderChatList();
  const data = chats[id];
  document.getElementById("chatTitle").textContent = data.title;
  const container = document.getElementById("chat");
  container.innerHTML = "";
  data.messages.slice(1).forEach(msg => {
    if (typeof msg.content === "string") addMessage(msg.content, msg.role === "user" ? "user" : "ai", true);
  });
  container.scrollTop = container.scrollHeight;
}

function addMessage(text, who, silent = false) {
  const div = document.createElement("div");
  div.className = `message ${who}`;
  div.innerHTML = `
    <div class="avatar">${who === "user" ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-leaf"></i>'}</div>
    <div class="bubble">${text.replace(/\n/g, "<br>")}</div>
  `;
  document.getElementById("chat").appendChild(div);
  if (!silent) document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
}

// ==================== SEND MESSAGE ====================
async function sendMessage(userText = "") {
  if (!userText) return;

  const commandResponse = handleSpecialCommands(userText);
  if (commandResponse) {
    addMessage(userText, "user");
    addMessage(commandResponse, "ai");

    if (!currentChatId) {
      currentChatId = generateChatId();
      chats[currentChatId] = { title: "Nowy czat", messages: [{ role: "system", content: "Jesteś Mullar" }], updated: Date.now() };
    }
    chats[currentChatId].messages.push({ role: "user", content: userText });
    chats[currentChatId].messages.push({ role: "assistant", content: commandResponse });
    chats[currentChatId].updated = Date.now();
    chats[currentChatId].title = userText.substring(0, 30);
    saveChats();
    renderChatList();
    return;
  }

  // Normalna wiadomość (do API)
  if (!currentChatId) {
    currentChatId = generateChatId();
    chats[currentChatId] = { title: "Nowy czat", messages: [{ role: "system", content: "Jesteś Mullar" }], updated: Date.now() };
  }

  addMessage(userText, "user");
  chats[currentChatId].messages.push({ role: "user", content: userText });

  const typing = document.createElement("div");
  typing.textContent = "Mullar pisze...";
  document.getElementById("chat").appendChild(typing);

  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_API_KEY}` },
      body: JSON.stringify({
        model: "meta-llama/llama-4-scout-17b-16e-instruct",
        messages: chats[currentChatId].messages,
        temperature: 0.85,
        max_tokens: 800
      })
    });
    const data = await res.json();
    const reply = data.choices[0].message.content.trim();
    typing.remove();
    addMessage(reply, "ai");
    chats[currentChatId].messages.push({ role: "assistant", content: reply });
    chats[currentChatId].updated = Date.now();
    saveChats();
    renderChatList();
  } catch (e) {
    typing.remove();
    addMessage("Błąd połączenia.", "ai");
  }
}

// ==================== EVENTS ====================
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = input.value.trim();
    if (text) {
      sendMessage(text);
      input.value = "";
    }
  }
});

sendBtn.addEventListener("click", () => {
  const text = input.value.trim();
  if (text) {
    sendMessage(text);
    input.value = "";
  }
});

input.addEventListener("input", () => {
  sendBtn.disabled = !input.value.trim();
});

// ==================== INIT ====================
function init() {
  renderChatList();
}
init();
</script>
</body>
</html>
