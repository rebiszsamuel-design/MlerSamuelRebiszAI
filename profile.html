<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mullar.Online</title>

    <link
        rel="stylesheet"
        href="/profile.css"
    >
</head>

<body>

    <div class="background">

        <div
            class="glow glow-1"
            id="glow1"
        ></div>

        <div
            class="glow glow-2"
            id="glow2"
        ></div>

    </div>


    <main
        class="profile-card"
        id="profileCard"
    >

        <!-- BANNER -->

        <div
            class="profile-banner"
            id="profileBanner"
        ></div>


        <!-- PROFILE BODY -->

        <section class="profile-content">

            <div class="identity-row">

                <!-- AVATAR -->

                <div class="avatar-column">

                    <div class="avatar-wrapper">

                        <div
                            class="avatar"
                            id="avatar"
                        >
                            M
                        </div>

                        <span
                            class="online"
                            title="Online"
                        ></span>

                    </div>

                </div>


                <!-- NAME + DETAILS -->

                <div class="identity-info">

                    <div class="profile-name">

                        <h1 id="username">
                            Mullar
                        </h1>

                        <span
                            class="badge free-badge"
                            id="plan"
                        >
                            FREE
                        </span>

                        <span
                            class="og-badge"
                            id="ogBadge"
                            title="Dołączył podczas tworzenia aplikacji!"
                        >
                            OG
                        </span>

                    </div>


                    <p
                        class="username"
                        id="handle"
                    >
                        @mullar
                    </p>


                    <p
                        class="bio"
                        id="bio"
                    >
                        No Bio Yet
                    </p>

                </div>

            </div>


            <!-- LINKS -->

            <div
                class="profile-links"
                id="profileLinks"
            ></div>


            <!-- STATS -->

            <div
                class="profile-stats"
                id="profileStats"
            >

                <div
                    class="stat"
                    id="viewsStat"
                >

                    <strong
                        class="stat-number"
                        id="viewsCount"
                    >
                        0
                    </strong>

                    <span class="stat-label">
                        wyświetleń
                    </span>

                </div>


                <div
                    class="stat"
                    id="likesStat"
                >

                    <button
                        id="likeButton"
                        class="like-button"
                        type="button"
                        aria-label="Polub profil"
                    >
                        ♡
                    </button>

                    <strong
                        class="stat-number"
                        id="likesCount"
                    >
                        0
                    </strong>

                    <span class="stat-label">
                        polubień
                    </span>

                </div>

            </div>


            <!-- MEMBER SINCE -->

            <div class="member-since">

                <span>
                    Członek od
                </span>

                <strong id="memberSince">
                    —
                </strong>

            </div>


            <!-- MUSIC -->

            <div
                class="music-player"
                id="musicPlayer"
            >

                <div class="music-icon">
                    ♪
                </div>

                <div class="music-info">

                    <strong>
                        Muzyka
                    </strong>

                    <span>
                        Profilowa muzyka
                    </span>

                </div>

                <audio
                    id="profileAudio"
                    controls
                    preload="none"
                ></audio>

            </div>

        </section>

    </main>


    <div
        class="loading"
        id="loading"
    >
        Ładowanie profilu...
    </div>


    <div
        class="error-screen"
        id="errorScreen"
    >

        <h1>
            Nie znaleziono profilu
        </h1>

        <p>
            Sprawdź nazwę użytkownika.
        </p>

        <a href="/">
            Wróć na Mullar.Online
        </a>

    </div>


    <script src="/profile.js"></script>

</body>
</html>
